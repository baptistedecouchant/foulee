# Exploration ponctuelle : quelles sources de calendrier des courses sont accessibles ?
name: Explorer les calendriers de courses
on: workflow_dispatch
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: RunningMap (data.gouv.fr)
        run: |
          curl -sS "https://www.data.gouv.fr/api/1/organizations/runningmap-org/datasets/" -o ds.json || true
          python3 - <<'PY'
          import json
          d=json.load(open('ds.json'))
          for x in d.get('data',[]):
              print('DATASET', x['title'], x.get('last_modified'), x.get('frequency'))
              for r in x['resources']:
                  print('  RES', r['title'], r.get('format'), r.get('filesize'), r.get('last_modified'), r['url'])
          PY
          for u in $(python3 -c "import json;d=json.load(open('ds.json'));print(' '.join(r['url'] for x in d.get('data',[]) for r in x['resources']))"); do
            echo "== $u"; curl -sSL "$u" | head -c 3000; echo; done
      - name: Recherche d'autres jeux de données
        run: |
          curl -sS "https://www.data.gouv.fr/api/1/datasets/?q=courses%20a%20pied%20calendrier&page_size=10" | python3 -c "
          import sys,json
          for x in json.load(sys.stdin)['data']:
              print(x['title'],'|',x['organization']['name'] if x.get('organization') else '','|',x.get('last_modified'),'|',[(r.get('format'),r['url']) for r in x['resources']][:3])"
