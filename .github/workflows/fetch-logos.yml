# Ponctuel : récupère des logos de marques sur Wikimedia Commons (avec leur licence).
name: Récupérer des logos
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir logos
          python3 - <<'PY'
          import json, subprocess, urllib.parse, urllib.request
          UA = {'User-Agent': 'logo-fetch/1.0 (github actions)'}
          def api(params):
              url = 'https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode({**params, 'format': 'json'})
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA)))
          wanted = {
            'asics': ['File:Asics Logo.svg'],
            'salomon': ['File:Salomon logo 2022.svg', 'File:Salomon logo.svg'],
            'brooks': ['File:Brooks Running logo.svg', 'File:Brooks Sports logo.svg', 'File:Brooks logo.svg', 'File:Brooks Running Logo.svg'],
            'on': ['File:On Running logo.svg', 'File:On (company) logo.svg', 'File:On AG logo.svg', 'File:On logo.svg', 'File:On-Running-Logo.svg', 'File:Logo On Running.svg'],
            'kiprun': ['File:Kiprun logo.svg', 'File:Logo Kiprun.svg', 'File:Kiprun.svg', 'File:Kiprun Logo.svg'],
          }
          searches = {'brooks': 'Brooks Running Company logo', 'on': 'On Holding logo running shoes', 'kiprun': 'Kiprun'}
          for name, titles in wanted.items():
              d = api({'action': 'query', 'titles': '|'.join(titles), 'prop': 'imageinfo', 'iiprop': 'url|extmetadata'})
              pages = [p for p in d['query']['pages'].values() if 'imageinfo' in p]
              if not pages and name in searches:
                  d = api({'action': 'query', 'generator': 'search', 'gsrsearch': searches[name], 'gsrnamespace': 6, 'gsrlimit': 8, 'prop': 'imageinfo', 'iiprop': 'url|extmetadata'})
                  pages = list((d.get('query', {}).get('pages', {}) or {}).values())
                  for p in pages:
                      print('  candidat', name, '|', p['title'], '|', p['imageinfo'][0].get('extmetadata', {}).get('LicenseShortName', {}).get('value'))
                  pages = []
              if not pages:
                  print('INTROUVABLE', name); continue
              p = pages[0]; ii = p['imageinfo'][0]; lic = ii.get('extmetadata', {}).get('LicenseShortName', {}).get('value', '?')
              subprocess.run(['curl', '-sSL', '-A', UA['User-Agent'], '-o', f'logos/{name}.svg', ii['url']], check=True)
              print('OK', name, '|', p['title'], '|', lic)
          PY
          ls -la logos
          for f in logos/*.svg; do echo "B64 $(basename $f) $(base64 -w0 $f)"; done
      - uses: actions/upload-artifact@v4
        with:
          name: logos
          path: logos
