# Ponctuel : récupère des logos de marques sur Wikimedia Commons (avec leur licence).
name: Récupérer des logos
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir logos
          for q in "Asics Logo" "Salomon logo" "Brooks Running logo" "On (company) logo" "Kiprun logo" "Decathlon logo"; do
            curl -sS -G "https://commons.wikimedia.org/w/api.php" -A "logo-fetch/1.0 (github actions)" \
              --data-urlencode "action=query" --data-urlencode "generator=search" --data-urlencode "gsrsearch=$q filetype:drawing" \
              --data-urlencode "gsrnamespace=6" --data-urlencode "gsrlimit=4" --data-urlencode "prop=imageinfo" \
              --data-urlencode "iiprop=url|extmetadata" --data-urlencode "format=json" > r.json
            python3 - "$q" <<'PY'
          import json, sys
          q = sys.argv[1]
          d = json.load(open('r.json'))
          for p in (d.get('query', {}).get('pages', {}) or {}).values():
              ii = p['imageinfo'][0]; m = ii.get('extmetadata', {})
              lic = m.get('LicenseShortName', {}).get('value', '?')
              print(f"{q} | {p['title']} | {lic} | {ii['url']}")
          PY
          done | tee logos/list.txt
          python3 - <<'PY'
          import subprocess
          seen = set()
          for line in open('logos/list.txt'):
              q, title, lic, url = [x.strip() for x in line.split('|')]
              if q in seen or not url.endswith('.svg'): continue
              seen.add(q)
              name = q.split()[0].lower()
              subprocess.run(['curl', '-sSL', '-A', 'logo-fetch/1.0', '-o', f'logos/{name}.svg', url])
              print('téléchargé', name, lic, title)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: logos
          path: logos
