# Mise en service du serveur (Supabase) depuis GitHub, sans ordinateur.
# Se lance à chaque modification de `supabase/` ou `packages/core/`, ou à la main (onglet Actions).
#
# Secrets de dépôt nécessaires (Settings → Secrets and variables → Actions) :
#   SUPABASE_ACCESS_TOKEN   supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_REF    la référence du projet (ex. abcdefghijkl)
#   SUPABASE_DB_PASSWORD    le mot de passe choisi à la création du projet
#   ANTHROPIC_API_KEY       coach IA (facultatif)
#   STRAVA_CLIENT_ID / STRAVA_CLIENT_SECRET / STRAVA_VERIFY_TOKEN   (facultatif)

name: Déployer le serveur

on:
  push:
    branches: [main]
    paths: ['supabase/**', 'packages/core/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Serveur non configuré (secrets SUPABASE_* absents) : rien à déployer."
            echo "SKIP=1" >> $GITHUB_ENV
          fi

      - uses: supabase/setup-cli@v1
        if: env.SKIP != '1'
        with:
          version: latest

      - name: Copier le moteur dans les fonctions
        if: env.SKIP != '1'
        run: node scripts/sync-core.mjs

      - name: Base de données
        if: env.SKIP != '1'
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all

      - name: Secrets des fonctions
        if: env.SKIP != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_VERIFY_TOKEN: ${{ secrets.STRAVA_VERIFY_TOKEN }}
        run: |
          : > secrets.env
          for k in ANTHROPIC_API_KEY STRAVA_CLIENT_ID STRAVA_CLIENT_SECRET STRAVA_VERIFY_TOKEN; do
            v="${!k}"; [ -n "$v" ] && echo "$k=$v" >> secrets.env
          done
          echo "APP_INTEGRITY_ENFORCED=false" >> secrets.env
          supabase secrets set --env-file secrets.env --project-ref "$PROJECT_REF"
          rm secrets.env

      - name: Fonctions
        if: env.SKIP != '1'
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Abonnement Strava (nouvelles séances en temps réel)
        if: env.SKIP != '1'
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_VERIFY_TOKEN: ${{ secrets.STRAVA_VERIFY_TOKEN }}
        run: |
          if [ -z "$STRAVA_CLIENT_ID" ]; then echo "Strava non configuré."; exit 0; fi
          existing=$(curl -s "https://www.strava.com/api/v3/push_subscriptions?client_id=$STRAVA_CLIENT_ID&client_secret=$STRAVA_CLIENT_SECRET")
          if echo "$existing" | grep -q '"id"'; then echo "Abonnement Strava déjà actif."; exit 0; fi
          curl -s -X POST https://www.strava.com/api/v3/push_subscriptions \
            -F client_id="$STRAVA_CLIENT_ID" -F client_secret="$STRAVA_CLIENT_SECRET" \
            -F callback_url="https://$PROJECT_REF.supabase.co/functions/v1/strava-webhook" \
            -F verify_token="$STRAVA_VERIFY_TOKEN"
